stages:
  - build
  - test
  - deploy

build:
  stage: build
  image: php:8.2-cli
  before_script:
    - apt-get update && apt-get install -y unzip git
    - curl -sS https://getcomposer.org/installer | php
  script:
    - php composer.phar install --no-interaction
  artifacts:
    paths:
      - vendor/

test:
  stage: test
  image: php:8.2-cli
  dependencies:
    - build
  script:
    - php tests/unit/tests/unit/EventTest.php
    - php tests/unit/FilterTest.php
    - php tests/unit/UserTest.php

deploy_to_vps:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache sshpass openssh

  script:
    - sshpass -p $VPS_PASSWORD ssh $VPS_USER@$VPS_HOST "
        cd /srv/reseau_social_ville &&
        git pull &&
        docker compose pull &&
        docker compose up -d --remove-orphans
      "
  only:
    - main
    - test-deploiement
