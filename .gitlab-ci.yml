stages:
  - test
  - build
  - deploy

variables:
  DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}?serverVersion=8.0"

test_app:
  stage: test
  image: php:8.2-cli

  services:
    - name: mysql:8
      alias: db
      command: ["--default-authentication-plugin=mysql_native_password"]
      variables:
        MYSQL_ROOT_PASSWORD: $MYSQL_ROOT_PASSWORD
        MYSQL_DATABASE: $MYSQL_DATABASE
        MYSQL_USER: $MYSQL_USER
        MYSQL_PASSWORD: $MYSQL_PASSWORD

  before_script:
    - apt-get update && apt-get install -y zip unzip git mariadb-client
    - docker-php-ext-install pdo pdo_mysql
    - cp .env.test .env
    - curl -sS https://getcomposer.org/installer | php
    - php composer.phar install --no-interaction

    # attendre que MySQL soit prêt
    - |
      echo "Waiting for MySQL to be ready..."
      MAX_TRIES=10
      TRIES=0
      until mysql -h db -u root -p"$MYSQL_ROOT_PASSWORD" --ssl-mode=DISABLED -e "SELECT 1;" >/dev/null 2>&1; do
        echo "Waiting for MySQL..."
        sleep 35
        TRIES=$((TRIES+1))
        if [ $TRIES -ge $MAX_TRIES ]; then
          echo "MySQL did not start in time, exiting."
          exit 1
        fi
      done

    - mysql -h db -u root -p"$MYSQL_ROOT_PASSWORD" -e "CREATE DATABASE IF NOT EXISTS ${MYSQL_DATABASE};"
    - mysql -h db -u root -p"$MYSQL_ROOT_PASSWORD" -e "GRANT ALL PRIVILEGES ON ${MYSQL_DATABASE}.* TO '${MYSQL_USER}'@'%'; FLUSH PRIVILEGES;"

  script:
    - php bin/console doctrine:migrations:migrate -n --env=test
    - php bin/phpunit

  only:
    - main
    - test-deploiement

build_image:
  stage: build
  image: docker:25.0.0
  services:
    - docker:25.0.0-dind
  script:
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main

deploy_to_vps:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache sshpass openssh
  script:
    - sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "
        cd /var/www/projet &&
        git pull &&
        docker-compose pull &&
        docker-compose up -d --remove-orphans
      "
  only:
    - main
