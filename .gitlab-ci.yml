stages:
  - test
  - build
  - deploy

test_app:
  stage: test
  image: php:8.2-cli

  services:
    - name: mysql:8
      alias: mysql
      command: ["--default-authentication-plugin=mysql_native_password"]
      variables:
        MYSQL_ROOT_PASSWORD: $MYSQL_ROOT_PASSWORD
        MYSQL_DATABASE: $MYSQL_DATABASE
        MYSQL_USER: $MYSQL_USER
        MYSQL_PASSWORD: $MYSQL_PASSWORD

  variables:
    DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?serverVersion=8.0"

  before_script:
    # =====================
    # DEBUG VARIABLES (TEMPORAIRE)
    # =====================
    - echo "DEBUG MYSQL_ROOT_PASSWORD='${MYSQL_ROOT_PASSWORD}'"
    - echo "DEBUG MYSQL_DATABASE='${MYSQL_DATABASE}'"
    - echo "DEBUG MYSQL_USER='${MYSQL_USER}'"

    # outils système
    - apt-get update && apt-get install -y zip unzip git mariadb-client

    # extensions PHP
    - docker-php-ext-install pdo pdo_mysql

    # env Symfony
    - cp .env.test .env

    # composer
    - curl -sS https://getcomposer.org/installer | php
    - php composer.phar install --no-interaction

    # attente MySQL
    - |
      echo "Waiting for MySQL..."
      MAX_TRIES=30
      TRIES=0
      until mysql -h mysql -u root -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1;" >/dev/null 2>&1; do
        echo "MySQL not ready yet..."
        sleep 2
        TRIES=$((TRIES+1))
        if [ $TRIES -ge $MAX_TRIES ]; then
          echo "MySQL did not start in time, exiting."
          exit 1
        fi
      done

    # création DB
    - mysql -h mysql -u root -p"$MYSQL_ROOT_PASSWORD" -e "CREATE DATABASE IF NOT EXISTS \`${MYSQL_DATABASE}\`;"
    - mysql -h mysql -u root -p"$MYSQL_ROOT_PASSWORD" -e "GRANT ALL PRIVILEGES ON \`${MYSQL_DATABASE}\`.* TO '${MYSQL_USER}'@'%'; FLUSH PRIVILEGES;"

  script:
    - php bin/console doctrine:migrations:migrate -n --env=test
    - php bin/phpunit

  only:
    - main
    - test-deploiement


build_image:
  stage: build
  image: docker:25.0.0
  services:
    - docker:25.0.0-dind
  script:
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main


deploy_to_vps:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache sshpass openssh
  script:
    - sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "
        cd /var/www/projet &&
        git pull &&
        docker-compose pull &&
        docker-compose up -d --remove-orphans
      "
  only:
    - main
