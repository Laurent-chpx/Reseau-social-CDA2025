stages:
  - test
  - build
  - deploy

variables:
  MYSQL_PASSWORD: $MYSQL_PASSWORD
  MYSQL_ROOT_PASSWORD: $MYSQL_ROOT_PASSWORD
  MYSQL_USER: $MYSQL_USER
  VPS_HOST: $VPS_HOST
  VPS_USER: $VPS_USER
  VPS_PASSWORD: $VPS_PASSWORD

test_app:
  stage: test
  image: php:8.2-cli

  services:
    - name: mysql:8
      alias: db

  variables:
    MYSQL_DATABASE: symfony
    MYSQL_USER: symfony_user
    MYSQL_PASSWORD: symfony_pass
    MYSQL_ROOT_PASSWORD: rootpass
    DATABASE_URL: "mysql://symfony_user:symfony_pass@db:3306/symfony_test?serverVersion=8.0"

  before_script:
    # outils système
    - apt-get update
    - apt-get install -y zip unzip git mariadb-client

    # extensions PHP
    - docker-php-ext-install pdo pdo_mysql

    # attendre que MySQL soit prêt
    - |
      until mysql -h db -u root -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1"; do
        echo "Waiting for MySQL..."
        sleep 2
      done

    # création DB + droits (LE POINT CLÉ)
    - mysql -h db -u root -p"$MYSQL_ROOT_PASSWORD" -e "CREATE DATABASE IF NOT EXISTS ${MYSQL_DATABASE}_test;"
    - mysql -h db -u root -p"$MYSQL_ROOT_PASSWORD" -e "GRANT ALL PRIVILEGES ON ${MYSQL_DATABASE}_test.* TO '${MYSQL_USER}'@'%'; FLUSH PRIVILEGES;"

    # env Symfony
    - cp .env.test .env

    # dépendances
    - curl -sS https://getcomposer.org/installer | php
    - php composer.phar install --no-interaction

  script:
    - php bin/console doctrine:migrations:migrate -n --env=test
    - php bin/phpunit

  only:
    - main
    - test-deploiement



build_image:
  stage: build
  image: docker:25.0.0
  services:
    - docker:25.0.0-dind
  script:
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main

deploy_to_vps:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache sshpass openssh
  script:
    - sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "
        cd /var/www/projet &&
        git pull &&
        docker-compose pull &&
        docker-compose up -d --remove-orphans
      "
  only:
    - main